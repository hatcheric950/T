[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bot"
dynamic = ["version"]
description = "Hermes: a multi-provider chat CLI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aioimaplib>=1.1.0",
    "aiosmtplib>=3.0",
    "aiosqlite>=0.20",
    "twilio>=9.0",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.scripts]
hermes = "hermes.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.dynamic]
version = { attr = "hermes.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
