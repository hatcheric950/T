[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bot"
version = "0.1.0"
description = "Hermes: a multi-provider chat CLI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7.0",
]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
