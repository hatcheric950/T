[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expensetracker"
version = "0.1.0"
description = "A simple expense tracking library"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.coverage.run]
source = ["src/expensetracker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
